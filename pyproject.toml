[project]
name = "sql-agents-ia"
version = "0.1.0"
description = ""
authors = [
    {name = "Denilson",email = "denilsonsantos00@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.138.0,<0.139.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "azure-storage-blob (>=12.30.0,<13.0.0)",
    "sentry-sdk (>=2.63.0,<3.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "duckdb (>=1.5.5,<2.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "openai (>=3.13.0,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "httpx2 (>=2.5.0,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)"
]
